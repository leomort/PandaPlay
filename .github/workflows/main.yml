# Compila o PandaPlay na nuvem do GitHub e publica o APK para baixar no celular.
# Roda sozinho a cada envio de arquivos (push) ou manualmente em Actions -> "Gerar APK" -> Run workflow.
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar a Release com o APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Baixar cores (emuladores de cada console)
        run: |
          set -e
          DEST=app/src/main/jniLibs/arm64-v8a
          BASE=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
          mkdir -p "$DEST"
          # mgba: GB/GBC/GBA | fceumm: NES | snes9x: SNES | mupen64plus_next_gles3: N64
          # desmume: Nintendo DS | genesis_plus_gx: Master System/Game Gear/Mega Drive | pcsx_rearmed: PS1
          for core in mgba fceumm snes9x mupen64plus_next_gles3 desmume genesis_plus_gx pcsx_rearmed; do
            echo "Baixando $core..."
            curl -fsSL --retry 3 "$BASE/${core}_libretro_android.so.zip" -o "/tmp/$core.zip"
            unzip -o -q "/tmp/$core.zip" -d /tmp/cores
            mv -f "/tmp/cores/${core}_libretro_android.so" "$DEST/lib${core}_libretro_android.so"
          done
          ls -la "$DEST"

      - name: Usar chave de assinatura fixa (permite atualizar sem desinstalar)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::Configure o secret DEBUG_KEYSTORE_BASE64 em Settings > Secrets and variables > Actions"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PandaPlay-${{ github.run_number }}.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: PandaPlay-apk
          path: PandaPlay-${{ github.run_number }}.apk

      - name: Publicar na página de Releases (fácil de baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PandaPlay build ${{ github.run_number }}
          body: APK de teste gerado automaticamente. Instale no celular, tablet ou Android TV (arm64).
          files: PandaPlay-${{ github.run_number }}.apk
          prerelease: true
